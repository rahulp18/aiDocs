services:
  postgres:
    image: ankane/pgvector
    container_name: rag_pg
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: rag_db
    ports:
      - '5434:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
